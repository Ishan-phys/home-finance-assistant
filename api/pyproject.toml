[project]
name = "cfo-api"
version = "0.1.0"
description = "cfo-api (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "cfo-metrics",
    "cfo-ledger",
    "cfo-ingest",
    "cfo-parse",
    "cfo-redact",
    "cfo-categorize",
    "cfo-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
cfo-metrics = { workspace = true }
cfo-ledger = { workspace = true }
cfo-ingest = { workspace = true }
cfo-parse = { workspace = true }
cfo-redact = { workspace = true }
cfo-categorize = { workspace = true }
cfo-agent = { workspace = true }
