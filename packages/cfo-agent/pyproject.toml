[project]
name = "cfo-agent"
version = "0.1.0"
description = "cfo-agent (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "cfo-metrics",
    "cfo-ledger",
    "cfo-redact",
    "google-adk>=2.11.0",
    "anthropic>=0.40",
    "litellm>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
cfo-metrics = { workspace = true }
cfo-ledger = { workspace = true }
cfo-redact = { workspace = true }
