[project]
name = "cfo-testing"
version = "0.1.0"
description = "cfo-testing (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "cfo-categorize",
    "cfo-redact",
    "pytest>=8",
]

[project.optional-dependencies]
pg = ["cfo-ledger", "testcontainers[postgres]>=4", "alembic>=1.13", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
cfo-ledger = { workspace = true }
cfo-categorize = { workspace = true }
cfo-redact = { workspace = true }
