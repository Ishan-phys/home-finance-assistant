[project]
name = "cfo-categorize"
version = "0.1.0"
description = "cfo-categorize (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "openai>=3.26.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
