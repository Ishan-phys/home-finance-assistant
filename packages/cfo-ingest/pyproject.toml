[project]
name = "cfo-ingest"
version = "0.1.0"
description = "cfo-ingest (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "cfo-parse",
    "cfo-redact",
    "cfo-categorize",
    "cfo-vault",
    "cfo-ledger",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
cfo-parse = { workspace = true }
cfo-redact = { workspace = true }
cfo-categorize = { workspace = true }
cfo-vault = { workspace = true }
cfo-ledger = { workspace = true }
