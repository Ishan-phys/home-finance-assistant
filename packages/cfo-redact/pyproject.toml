[project]
name = "cfo-redact"
version = "0.1.0"
description = "cfo-redact (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-doc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-doc = { workspace = true }
