[project]
name = "cfo-parse"
version = "0.1.0"
description = "cfo-parse (part of AI CFO)"
requires-python = ">=3.13"
dependencies = [
    "cfo-core",
    "cfo-doc",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.16.0",
    "msoffcrypto-tool>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo"]

[tool.uv.sources]
cfo-core = { workspace = true }
cfo-doc = { workspace = true }
