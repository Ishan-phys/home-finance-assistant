# A second, throwaway stack for the browser tests, so they never touch the data in `make up`.
# Used by `make e2e`: its own project name (so its own volumes), other ports, and no model keys
# (the tests expect the categorizer to be off, as in CI).
services:
  api:
    env_file: !override
      - .env.example
    environment:
      # Throwaway test owner, plain HTTP on loopback. Not a real password or secret.
      OWNER_USERNAME: owner
      OWNER_PASSWORD_HASH: 'scrypt$$32768$$8$$1$$t_qJXf1w6eCVemXxhnxAdQ$$rMoKscTerMYVOuGXTxyxt3kuh3mLam5InkDhcXu2mKk'
      SESSION_SECRET: e2e-session-secret-not-used-anywhere-else-0123456789
      SESSION_COOKIE_SECURE: "false"
    ports: !override
      - "127.0.0.1:8100:8000"
  web:
    ports: !override
      - "127.0.0.1:3210:3000"
