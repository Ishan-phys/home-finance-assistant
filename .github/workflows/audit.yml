name: audit

# Checks every dependency that is already in the lockfiles against known-vulnerability and
# malware advisories, and checks npm packages for valid registry signatures. It also runs
# weekly: advisories are published against versions we already use, with no code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: audit python packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Audit the locked, shipped Python dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-emit-workspace --no-hashes --no-dev -o requirements-audit.txt
          # Advisories we have looked at and accepted, with the reason, are in this file.
          args=()
          while read -r id _; do args+=(--ignore-vuln "$id"); done \
            < <(grep -vE '^\s*(#|$)' .github/pip-audit-ignore.txt)
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip "${args[@]}"

  web:
    name: audit web packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities and malware advisories (high and above)
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance attestations
        run: npm audit signatures
