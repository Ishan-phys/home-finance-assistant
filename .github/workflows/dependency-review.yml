name: dependency review

# Blocks a pull request that adds or upgrades a dependency to a version with a known
# vulnerability or a published malware advisory (GitHub Advisory Database).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the summary comment

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
