version: 2
updates:
  # Each ecosystem bundles all of its updates into one weekly (or monthly) pull request.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: monthly }
    groups:
      all-dependencies:
        patterns: ["*"]
