version: 2

# One weekly pull request carries every dependency update, across all ecosystems.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directory: /api
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
